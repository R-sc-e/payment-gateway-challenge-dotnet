name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore PaymentGateway.sln
      - name: Build
        run: dotnet build PaymentGateway.sln --configuration Release --no-restore
      - name: Create coverage directory
        run: mkdir -p coverage
      - name: Test focused suite and collect coverage
        run: >-
          dotnet test test/PaymentGateway.Api.Tests/PaymentGateway.Api.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage/unit.json
          /p:CoverletOutputFormat=json
      - name: Test integration suite, merge and enforce coverage
        run: >-
          dotnet test test/PaymentGateway.Api.IntegrationTests/PaymentGateway.Api.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          /p:CollectCoverage=true
          /p:MergeWith=${{ github.workspace }}/coverage/unit.json
          /p:CoverletOutput=${{ github.workspace }}/coverage/coverage.cobertura.xml
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=85
          /p:ThresholdType=line%2cbranch
          /p:ThresholdStat=total
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/coverage.cobertura.xml
          if-no-files-found: warn
      - name: Build container
        run: docker build --target final --tag payment-gateway:test .
