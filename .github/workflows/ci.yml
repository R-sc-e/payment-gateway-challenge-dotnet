name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore PaymentGateway.sln
      - name: Build
        run: dotnet build PaymentGateway.sln --configuration Release --no-restore
      - name: Test and enforce coverage
        run: >-
          dotnet test PaymentGateway.sln
          --configuration Release
          --no-build
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage/coverage.cobertura.xml
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=85
          /p:ThresholdType=line%2cbranch
          /p:ThresholdStat=total
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/coverage.cobertura.xml
      - name: Build container
        run: docker build --target final --tag payment-gateway:test .
